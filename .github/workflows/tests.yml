name: tests

# Runs the tests I have written so far. From Week 7 onward most weeks add some.
# Weeks with no tests pass trivially rather than failing the build — this is a learning
# repository, and a permanently red badge teaches nothing except to ignore the badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip` here on purpose: the cache needs a dependency file at the repo root,
      # and there is not one until a week adds requirements. It fails the job rather than
      # skipping the cache.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Install any week-level requirements
        shell: bash
        run: |
          shopt -s globstar nullglob
          found=0
          for f in **/requirements.txt; do
            found=1
            echo "::group::$f"
            python -m pip install -r "$f" || echo "could not install $f — continuing"
            echo "::endgroup::"
          done
          [ "$found" = 0 ] && echo "No week requirements yet."
          exit 0

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --continue-on-collection-errors
          status=$?
          set -e
          # pytest exits 5 when it collected no tests at all, which is expected early on.
          if [ "$status" -eq 5 ]; then
            echo "No tests collected yet — passing."
            exit 0
          fi
          exit "$status"
